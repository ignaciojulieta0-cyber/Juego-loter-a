<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Sorteo en Vivo</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  margin:0;
  background:#0b1220;
  color:white;
  font-family:Arial,sans-serif;
}
.hidden{display:none}

.login{
  max-width:320px;
  margin:70px auto;
  background:#020617;
  border:2px solid gold;
  border-radius:14px;
  padding:20px;
}
.login h2{text-align:center;color:gold}
.login input,.login button{
  width:100%;
  padding:10px;
  margin:8px 0;
  border-radius:8px;
  border:none;
}
.login button{background:gold;font-size:16px;cursor:pointer}

.info{
  max-width:900px;
  margin:10px auto;
  padding:10px;
  background:#020617;
  border:2px solid gold;
  border-radius:14px;
  display:flex;
  justify-content:space-between;
}

.video-container{
  max-width:900px;
  margin:10px auto;
}
video{
  width:100%;
  height:260px;
  background:black;
  border-radius:14px;
  border:3px solid gold;
}

.numeros-grid{
  max-width:900px;
  margin:15px auto;
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(50px,1fr));
  gap:6px;
}
.numero{
  padding:10px 0;
  text-align:center;
  border-radius:8px;
  font-weight:bold;
  cursor:pointer;
  background:#22c55e;
  color:black;
}
.numero.pendiente{background:#facc15}
.numero.bloqueado{
  background:#dc2626;
  color:white;
  cursor:not-allowed;
}
.numero.mio{background:gold}

.admin-panel{
  max-width:900px;
  margin:15px auto;
  background:#020617;
  border:2px solid gold;
  border-radius:14px;
  padding:10px;
}
.admin-panel h3{text-align:center;color:gold}

button{
  padding:6px 10px;
  border-radius:6px;
  border:none;
  cursor:pointer;
}
.confirmar{background:#22c55e}
.liberar{background:#dc2626;color:white}
.logout{background:#dc2626;color:white;margin:10px auto;display:block}
</style>
</head>

<body>

<!-- LOGIN -->
<div class="login" id="login">
  <h2>Ingreso Sorteo</h2>
  <input id="user" placeholder="Usuario">
  <input id="pass" type="password" placeholder="PIN">
  <button onclick="login()">Ingresar</button>
</div>

<!-- APP -->
<div id="app" class="hidden">

  <div class="info">
    <span>👤 <b id="nombre"></b></span>
    <span>💰 Saldo: $<b id="saldo"></b></span>
    <span>Rol: <b id="rolTxt"></b></span>
  </div>

  <div class="video-container">
    <video id="video" autoplay playsinline></video>
  </div>

  <div id="numerosGrid" class="numeros-grid"></div>

  <!-- PANEL ADMIN -->
  <div id="adminPanel" class="admin-panel hidden">
    <h3>Panel Administrador</h3>
    <div id="pendientes"></div>
  </div>

  <button class="logout" onclick="location.reload()">Cerrar sesión</button>
</div>

<!-- FIREBASE -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<script>
// 🔥 CONFIG FIREBASE
firebase.initializeApp({
  apiKey: "TU_API_KEY",
  authDomain: "TU_DOMINIO",
  databaseURL: "TU_DATABASE_URL",
  projectId: "TU_PROJECT_ID"
});
const db = firebase.database();

/* ======================
   CONFIGURACIÓN
====================== */
const PRECIO = 1000;
const TOTAL_NUMEROS = 300;

/* ======================
   USUARIOS
====================== */
const usuarios = {
  ignacio:{ pass:"12345", rol:"admin", saldo:15000 },
  juan:{ pass:"1111", rol:"user", saldo:5000 }
};

let usuarioActivo, rol;
const numerosRef = db.ref("numeros");

/* ======================
   LOGIN
====================== */
function login(){
  const u = user.value.trim();
  const p = pass.value.trim();

  if(!usuarios[u] || usuarios[u].pass!==p){
    alert("Credenciales incorrectas");
    return;
  }

  usuarioActivo = u;
  rol = usuarios[u].rol;

  login.style.display="none";
  app.classList.remove("hidden");

  nombre.innerText = u;
  saldo.innerText = usuarios[u].saldo;
  rolTxt.innerText = rol;

  crearNumeros();
  escucharNumeros();

  if(rol==="admin"){
    adminPanel.classList.remove("hidden");
    iniciarAdminCamara();
  }else{
    iniciarUsuarioCamara();
  }
}

/* ======================
   VIDEO WEBRTC
====================== */
let pc;
const sala="sorteo";

function crearPC(){
  pc = new RTCPeerConnection({
    iceServers:[{urls:"stun:stun.l.google.com:19302"}]
  });

  pc.ontrack = e=>video.srcObject=e.streams[0];
  pc.onicecandidate = e=>{
    if(e.candidate){
      db.ref("ice").push(JSON.stringify(e.candidate));
    }
  };
}

async function iniciarAdminCamara(){
  crearPC();
  const stream = await navigator.mediaDevices.getUserMedia({video:true});
  video.srcObject = stream;
  stream.getTracks().forEach(t=>pc.addTrack(t,stream));

  const offer = await pc.createOffer();
  await pc.setLocalDescription(offer);
  db.ref("offer").set(JSON.stringify(offer));

  db.ref("answer").on("value", s=>{
    if(s.exists()) pc.setRemoteDescription(JSON.parse(s.val()));
  });

  db.ref("ice").on("child_added", s=>{
    pc.addIceCandidate(JSON.parse(s.val()));
  });
}

function iniciarUsuarioCamara(){
  crearPC();
  db.ref("offer").on("value", async s=>{
    if(!s.exists()) return;
    await pc.setRemoteDescription(JSON.parse(s.val()));
    const answer = await pc.createAnswer();
    await pc.setLocalDescription(answer);
    db.ref("answer").set(JSON.stringify(answer));
  });

  db.ref("ice").on("child_added", s=>{
    pc.addIceCandidate(JSON.parse(s.val()));
  });
}

/* ======================
   NUMEROS
====================== */
function crearNumeros(){
  numerosGrid.innerHTML="";
  for(let i=1;i<=TOTAL_NUMEROS;i++){
    const d=document.createElement("div");
    d.className="numero";
    d.innerText=i.toString().padStart(3,"0");
    d.onclick=()=>comprarNumero(i);
    numerosGrid.appendChild(d);
  }
}

function comprarNumero(n){
  if(rol==="admin") return;

  numerosRef.child(n).once("value", s=>{
    if(s.exists()) return alert("Número no disponible");
    if(usuarios[usuarioActivo].saldo<PRECIO) return alert("Saldo insuficiente");

    usuarios[usuarioActivo].saldo-=PRECIO;
    saldo.innerText=usuarios[usuarioActivo].saldo;

    numerosRef.child(n).set({
      usuario:usuarioActivo,
      estado:"pendiente",
      fecha:Date.now()
    });
  });
}

function escucharNumeros(){
  numerosRef.on("value", snap=>{
    document.querySelectorAll(".numero").forEach(div=>{
      const n=parseInt(div.innerText);
      const d=snap.child(n).val();
      div.className="numero";
      if(!d) return;

      if(d.estado==="pendiente") div.classList.add("pendiente");
      if(d.estado==="confirmado"){
        div.classList.add("bloqueado");
        if(d.usuario===usuarioActivo) div.classList.add("mio");
      }
    });

    if(rol==="admin") cargarPendientes(snap);
  });
}

/* ======================
   PANEL ADMIN
====================== */
function cargarPendientes(snap){
  pendientes.innerHTML="";
  snap.forEach(c=>{
    const d=c.val();
    if(d.estado==="pendiente"){
      const div=document.createElement("div");
      div.innerHTML=`
        Nº ${c.key} - ${d.usuario}
        <button class="confirmar" onclick="confirmar(${c.key})">Confirmar</button>
        <button class="liberar" onclick="liberar(${c.key})">Liberar</button>
      `;
      pendientes.appendChild(div);
    }
  });
}

function confirmar(n){
  numerosRef.child(n).update({estado:"confirmado"});
}

function liberar(n){
  numerosRef.child(n).once("value", s=>{
    if(!s.exists()) return;
    const u=s.val().usuario;
    usuarios[u].saldo+=PRECIO;
    if(u===usuarioActivo) saldo.innerText=usuarios[u].saldo;
    numerosRef.child(n).remove();
  });
}
</script>

</body>
   </html>
