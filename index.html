<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Rifita en Vivo</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  margin:0;
  background:#0b1220;
  color:white;
  font-family:Arial, sans-serif;
}
.hidden{display:none}

.login{
  max-width:320px;
  margin:70px auto;
  background:#020617;
  border:2px solid gold;
  border-radius:14px;
  padding:20px;
}
.login h2{text-align:center;color:gold}
.login input,.login button{
  width:100%;
  padding:10px;
  margin:8px 0;
  border-radius:8px;
  border:none;
}
.login button{background:gold;font-size:16px}

.info{
  max-width:900px;
  margin:10px auto;
  padding:10px;
  background:#020617;
  border:2px solid gold;
  border-radius:14px;
  display:flex;
  justify-content:space-between;
}

.video-container{
  max-width:900px;
  margin:10px auto;
}
video{
  width:100%;
  height:260px;
  background:black;
  border-radius:14px;
  border:3px solid gold;
}

.numeros-grid{
  max-width:900px;
  margin:15px auto;
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(50px,1fr));
  gap:6px;
}
.numero{
  padding:10px 0;
  text-align:center;
  border-radius:8px;
  font-weight:bold;
  cursor:pointer;
  background:#22c55e;
  color:black;
}
.numero.pendiente{background:#facc15}
.numero.bloqueado{
  background:#dc2626;
  color:white;
  cursor:not-allowed;
}
.numero.mio{background:gold}

.admin-panel{
  max-width:900px;
  margin:15px auto;
  background:#020617;
  border:2px solid gold;
  border-radius:14px;
  padding:10px;
}
.admin-panel h3{text-align:center;color:gold}

button{
  padding:6px 10px;
  border-radius:6px;
  border:none;
  cursor:pointer;
}
.confirmar{background:#22c55e}
.liberar{background:#dc2626;color:white}
.logout{background:#dc2626;color:white;margin:10px auto;display:block}
</style>
</head>

<body>

<!-- LOGIN -->
<div class="login" id="login">
  <h2>Ingreso Rifita</h2>
  <input id="user" placeholder="Usuario">
  <input id="pass" type="password" placeholder="PIN">
  <button id="btnLogin">Ingresar</button>
</div>

<!-- APP -->
<div id="app" class="hidden">

  <div class="info">
    <span>👤 <b id="nombre"></b></span>
    <span>💰 Saldo: $<b id="saldo"></b></span>
    <span>Rol: <b id="rolTxt"></b></span>
  </div>

  <div class="video-container">
    <video id="video" autoplay playsinline></video>
  </div>

  <div id="numerosGrid" class="numeros-grid"></div>

  <!-- PANEL ADMIN -->
  <div id="adminPanel" class="admin-panel hidden">
    <h3>Pendientes de Confirmación</h3>
    <div id="pendientes"></div>
  </div>

  <button class="logout" onclick="location.reload()">Cerrar sesión</button>
</div>

<script type="module">

   FIREBASE v12
========================= */

import {
  getDatabase, ref, set, update, remove,
  onValue, get, child, push
} from "https://www.gstatic.com/firebasejs/
