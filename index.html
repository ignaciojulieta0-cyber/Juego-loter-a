<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Rifa en Vivo</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{margin:0;background:#0b1220;color:white;font-family:Arial}
.hidden{display:none}
.box{background:#020617;border:2px solid gold;border-radius:14px;padding:16px;margin:12px auto;max-width:900px}
h2,h3{text-align:center;color:gold}
input,button{width:100%;padding:10px;margin:6px 0;border-radius:8px;border:none}
button{background:gold;font-weight:bold;cursor:pointer}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(55px,1fr));gap:6px}
.num{background:white;color:black;text-align:center;padding:10px;border-radius:6px;font-weight:bold;cursor:pointer}
.num.libre{background:white}
.num.pendiente{background:orange}
.num.comprado{background:gold;pointer-events:none}
.admin{border:2px dashed red}
video{width:100%;border-radius:14px;border:3px solid gold;background:black}
</style>
</head>

<body>

<!-- LOGIN ADMIN -->
<div class="box" id="adminLogin">
<h2>🔐 Admin</h2>
<input id="adminUser" placeholder="Usuario">
<input id="adminPin" type="password" placeholder="PIN">
<button onclick="loginAdmin()">Ingresar</button>
</div>

<!-- LOGIN USUARIO -->
<div class="box hidden" id="userLogin">
<h2>👤 Usuario</h2>
<input id="userName" placeholder="Tu nombre">
<button onclick="loginUser()">Ingresar</button>
</div>

<!-- APP -->
<div id="app" class="hidden">

<div class="box">
<h3>📡 Transmisión en vivo</h3>
<video id="video" autoplay playsinline muted></video>
</div>

<div class="box">
<h3>🎟️ Números (1 al 300)</h3>
<div class="grid" id="numeros"></div>
</div>

<div class="box admin hidden" id="adminPanel">
<h3>🛠️ Panel Admin</h3>
<button onclick="confirmarCompras()">Confirmar compras</button>
<button onclick="liberarTodo()">Liberar todos</button>
</div>

</div>

<!-- FIREBASE -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-app.js";
import { getFirestore, doc, getDoc, setDoc, updateDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-firestore.js";
import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-auth.js";

/* ================= CONFIG ================= */
const firebaseConfig = {
  apiKey: "AIzaSyBm2cOpwT87SExFelGUldPXgelQCB_0AYo",
  authDomain: "rifita-en-vivo.firebaseapp.com",
  projectId: "rifita-en-vivo",
  storageBucket: "rifita-en-vivo.firebasestorage.app",
  messagingSenderId: "974961349682",
  appId: "1:974961349682:web:4c3aa3441220ec735a982b"
};

const ADMIN_EMAIL = "rifagana2311@gmail.com";
const ADMIN_PASS  = "Admin123!"; // la MISMA de Firebase Auth

/* ================= INIT ================= */
const appFB = initializeApp(firebaseConfig);
const db = getFirestore(appFB);
const auth = getAuth(appFB);

let isAdmin = false;
let usuario = "";

/* ================= ADMIN LOGIN ================= */
window.loginAdmin = async ()=>{
  const u = adminUser.value.trim();
  const p = adminPin.value.trim();

  const snap = await getDoc(doc(db,"admin","principal"));
  if(!snap.exists()) return alert("Admin no configurado");

  const d = snap.data();
  if(u === d.usuario && p === d.pin){
    await signInWithEmailAndPassword(auth, ADMIN_EMAIL, ADMIN_PASS);
    isAdmin = true;
    iniciar();
  } else {
    alert("PIN incorrecto");
  }
};

/* ================= USER LOGIN ================= */
window.loginUser = ()=>{
  usuario = userName.value.trim();
  if(!usuario) return;
  iniciar();
};

/* ================= INICIAR ================= */
function iniciar(){
  adminLogin.classList.add("hidden");
  userLogin.classList.add("hidden");
  app.classList.remove("hidden");
  if(isAdmin) adminPanel.classList.remove("hidden");
  iniciarCamara();
  iniciarNumeros();
}

/* ================= CAMARA (SOLO ADMIN) ================= */
function iniciarCamara(){
  if(!isAdmin) return;
  navigator.mediaDevices.getUserMedia({video:true,audio:false})
    .then(stream => video.srcObject = stream)
    .catch(()=>alert("No se pudo acceder a la cámara"));
}

/* ================= NUMEROS ================= */
const refNumeros = doc(db,"rifa","numeros");

async function iniciarNumeros(){
  const snap = await getDoc(refNumeros);
  if(!snap.exists()){
    let base = {};
    for(let i=1;i<=300;i++) base[i] = "libre";
    await setDoc(refNumeros, base);
  }

  onSnapshot(refNumeros, s => pintarNumeros(s.data()));
}

function pintarNumeros(data){
  numeros.innerHTML="";
  for(let i=1;i<=300;i++){
    const d = document.createElement("div");
    d.className = "num " + data[i];
    d.innerText = i;
    d.onclick = ()=>comprarNumero(i,data[i]);
    numeros.appendChild(d);
  }
}

async function comprarNumero(n,estado){
  if(isAdmin) return;
  if(estado !== "libre") return;
  await updateDoc(refNumeros,{[n]:"pendiente"});
}

/* ================= ADMIN ================= */
window.confirmarCompras = async ()=>{
  const snap = await getDoc(refNumeros);
  let d = snap.data();
  for(let k in d) if(d[k]==="pendiente") d[k]="comprado";
  await setDoc(refNumeros,d);
};

window.liberarTodo = async ()=>{
  let d = {};
  for(let i=1;i<=300;i++) d[i]="libre";
  await setDoc(refNumeros,d);
};
</script>

</body>
</html>
